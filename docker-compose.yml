version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: referral-saas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: referral_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - referral-network

  app:
    build: .
    container_name: referral-saas-app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/referral_saas?schema=public
      NEXTAUTH_SECRET: your-secret-key-change-this
      NEXTAUTH_URL: http://localhost:5173
      VITE_APP_URL: http://localhost:5173
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - referral-network

volumes:
  postgres_data:

networks:
  referral-network:
    driver: bridge
